plugins {
    id 'net.neoforged.gradle.userdev' version '6.0.129'
}

repositories {
    mavenCentral()
    maven {
        name = 'NeoForge'
        url = "https://maven.neoforged.net/releases"
    }
}

ext.neo {
    modId = 'seashellmod'
    version = project.property('mod_version')
    mcVersion = project.property('minecraft_version')
    runs {
        client {
            workingDirectory project.file('run')
        }
        data {
            workingDirectory project.file('run')
        }
    }
}
